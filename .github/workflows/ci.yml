name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the matrix against a commit that is already pushed. Needed because a
  # push-triggered run cannot be replayed for a tree it never saw — which is
  # exactly the hole a disabled workflow leaves behind when it is turned back on.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.17 is the advertised floor (engines >=22.17) — pinned exactly so
        # the floor is tested, not just declared; it matches the floor of the
        # vendored gherkin-node-test runner the whole suite executes on. 22
        # and 24 float to each line's latest (22 rides maintenance to 2027-04,
        # 24 is active LTS). 18 and 20 are past their end of life and the
        # 0.11 runner does not support them.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.17', 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Zero runtime deps; this only fetches dev tooling (typescript, @types/node).
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # The publish-time gates used to run ONLY at publish, on one machine —
      # which is how scan-package went inert for a whole release without
      # anyone seeing it. The scan's own probe is pinned in the suite above
      # now; lint runs here so nothing in the prepublish chain is unobserved
      # until the moment it is load-bearing.
      - run: npm run lint
